<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}TradeGrade{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
      header.hero {padding: 2rem 0; text-align:center}
      .card {border:1px solid #e5e7eb; border-radius:12px; padding:1rem; margin:.5rem 0}
      .grid {display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:1rem}
      nav ul li a.active {text-decoration: underline}
      .muted {color:#6b7280}
      .badge {display:inline-block; padding:.2rem .5rem; border-radius:9999px; font-size:.8rem; background:#eef2ff; color:#3730a3}
      .player-card {display:flex; gap:.75rem; align-items:center}
      .player-card img {width:48px; height:48px; border-radius:50%; object-fit:cover; background:#f3f4f6}
      .section-title {display:flex; justify-content:space-between; align-items:center; margin-top:1rem}
      .actions {display:flex; gap:.5rem; flex-wrap:wrap}
    </style>
  </head>
  <body>
    <nav class="container">
      <ul>
        <li><strong><a href="/">TradeGrade</a></strong></li>
      </ul>
      <ul>
        <li><a href="{{ url_for('league.dashboard') }}">Dashboard</a></li>
        <li><a href="{{ url_for('auth.login') }}">Login</a></li>
        <li><a href="{{ url_for('auth.register') }}">Register</a></li>
        <li><a href="{{ url_for('auth.logout') }}">Logout</a></li>
      </ul>
    </nav>
    <main class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <article class="{{ category }}">{{ message }}</article>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      const socket = io();
    </script>
  </body>
  </html>
