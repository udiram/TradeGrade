{% extends 'base.html' %}
{% block title %}Login - TradeGrade{% endblock %}
{% block content %}
<h3>Login</h3>
<form method="post" class="card">
  <label>Email <input type="email" name="email" required placeholder="you@example.com"></label>
  <label>Password <input type="password" name="password" required placeholder="••••••••"></label>
  <div>
    <button type="submit">Login</button>
    <a href="#" role="button" class="secondary" onclick="demoLogin(event)">One-click Demo</a>
  </div>
  <p class="muted">Need an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</form>
<script>
  async function demoLogin(e){
    e.preventDefault();
    const form = document.querySelector('form');
    const email = form.querySelector('input[name="email"]');
    const pw = form.querySelector('input[name="password"]');
    email.value = 'demo@tradegrade.dev';
    pw.value = 'demo-demo';
    form.submit();
  }
</script>
{% endblock %}
