{% extends 'base.html' %}
{% block title %}Register - TradeGrade{% endblock %}
{% block content %}
<h3>Register</h3>
<form method="post" class="card">
  <label>Display Name <input type="text" name="display_name" required placeholder="Pat Mahomes"></label>
  <label>Email <input type="email" name="email" required placeholder="you@example.com"></label>
  <label>Password <input type="password" name="password" required placeholder="••••••••"></label>
  <div>
    <button type="submit">Create Account</button>
  </div>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</form>
{% endblock %}
